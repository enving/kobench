  quellen: [jira:TW-110]

- id: q08
  typ: version
  frage: "Wie viel Rabatt darf der Vertrieb allein geben, und was kostet das Business-Paket?"
  gold: >
    Bis 10 Prozent allein; 10 bis 20 Prozent braucht die Vertriebsleitung, darüber die Geschäftsführung. Business kostet
    24 USD je Nutzer und Monat (gültig ab 01.09.2026). Die Kopie mit 15 Prozent und 20 USD ist ein alter Entwurf.
  punkte:
    - Bis 10 Prozent allein
    - Business 24 USD je Nutzer und Monat
    - Nennt nicht 15 Prozent oder 20 USD als aktuell
  quellen: [confluence:40103]

