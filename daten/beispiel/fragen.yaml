# Fragenkatalog Tidewell Software (Beispielfirma, Korpus: dokumente.jsonl). Stichtag 15.10.2026.
# Jede Musterantwort ist am Beispielkorpus belegt (tests/test_beispiel.py prüft, dass alle Quellen existieren).
# Felder und Typen: docs/format.md.

- id: q01
  typ: fakt
  frage: "Wie ist der Stand beim Ticket TW-101?"
  gold: >
    TW-101 (Routen-Export bricht bei mehr als 500 Stopps mit Timeout ab, Kunde Harbor Freight Logistics) ist In Progress,
    Priorität High, bearbeitet von Hana Okafor. Workaround: Route in zwei Exporte teilen. Der Fix ist für Release 4.8 geplant.
  punkte:
    - Status In Progress
    - Priorität High
    - Bearbeiterin Hana Okafor
    - Problem - Export von Routen mit mehr als 500 Stopps läuft in einen Timeout
    - Fix für Release 4.8 geplant
  quellen: [jira:TW-101]

- id: q02
  typ: fakt
  frage: "In welcher Phase steht die Erweiterung bei Corvid Analytics, wie viel ist sie wert und bis wann soll sie unterschrieben sein?"
  gold: "Corvid Analytics - Expansion (deal-2): Stage Proposal, 92.300 USD, Close-Datum 15.12.2026."
  punkte:
    - Stage Proposal
    - Betrag 92.300 USD
    - Close-Datum 15.12.2026
  quellen: [salesforce:deal-2]

- id: q03
  typ: fakt
  frage: "Warum haben die Patienten von Maplewood Dental Group jede Erinnerung doppelt bekommen, und seit wann ist das behoben?"
  gold: >
    Ursache war ein doppelter Cron-Eintrag nach dem Deploy von Version 4.6 (TW-102). Entfernt in 4.6.2,
    erledigt am 05.09.2026.
  punkte:
    - Ursache doppelter Cron-Eintrag nach dem 4.6-Deploy
    - Behoben in 4.6.2
    - Erledigt am 05.09.2026
  quellen: [jira:TW-102]

- id: q04
  typ: liste
  frage: "Welche Deals sind noch offen, und wie hoch ist ihre Summe?"
  gold: >
    Offen sind vier Deals: Harbor Freight Logistics - Renewal (184.000 USD, Negotiation), Silverline Credit Union - Renewal
    (131.750 USD, Prospecting), Corvid Analytics - Expansion (92.300 USD, Proposal) und Aldermere Schools Trust - Pilot
    (19.900 USD, Qualification). Zusammen 427.950 USD.
  punkte:
    - Harbor Freight Logistics Renewal ist dabei
    - Silverline Credit Union Renewal ist dabei
    - Corvid Analytics Expansion ist dabei
    - Aldermere Schools Trust Pilot ist dabei
    - Summe 427.950 USD
    - Abgeschlossene Deals (Maplewood, Northgate) sind nicht dabei
  quellen: [salesforce:deal-0, salesforce:deal-2, salesforce:deal-4, salesforce:deal-5]

- id: q05
  typ: multihop
  frage: "Was hält die Vertragsverlängerung bei Silverline Credit Union auf, und wie weit sind wir damit?"
  gold: >
    Die Verlängerung (deal-4, Prospecting, 131.750 USD, Close 20.01.2027) hängt am Security-Review: 96 von 140 Fragen
    sind beantwortet. Offen sind Datenresidenz (muss in der EU bleiben), SAML-Single-Sign-on und der Pentest-Bericht.
    SAML ist TW-105, In Progress, High, Hana Okafor, geschätzt 6 Arbeitstage.
  punkte:
    - 96 von 140 Fragen des Fragebogens beantwortet
    - Offen Datenresidenz in der EU
    - Offen SAML-Login (TW-105 in Arbeit, Hana Okafor)
    - Offen Pentest-Bericht
  quellen: [confluence:40107, jira:TW-105, salesforce:deal-4]

- id: q06
  typ: multihop
  frage: "Was ist bei Northgate Brewing in diesem Jahr gewonnen und was verloren worden, und warum?"
  gold: >
    Gewonnen: der Pilot (deal-3, 28.000 USD, 02.07.2026). Verloren: die Erweiterung (deal-6, 55.000 USD, 14.08.2026),
    an einen Wettbewerber wegen des Preises.
  punkte:
    - Pilot gewonnen, 28.000 USD
    - Erweiterung verloren, 55.000 USD
    - Grund Preis, Wettbewerber
  quellen: [salesforce:deal-3, salesforce:deal-6, confluence:40109]

