[project]
name = "kobench"
version = "0.1.0"
description = "Kobench: Wege, Unternehmensdaten an eine KI anzubinden, auf denselben Fragen vergleichen"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "numpy>=2.0",
  "pyyaml>=6.0",
  "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
kobench = "kobench.lauf:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kobench"]

[tool.hatch.build.targets.wheel.force-include]
"daten/beispiel" = "kobench/_beispiel"

[tool.pytest.ini_options]
testpaths = ["tests"]
